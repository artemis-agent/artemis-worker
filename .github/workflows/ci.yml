name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    lint-python:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: artemis-scraper
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: pip install ruff
            - run: ruff check .
            - run: ruff format --check .

    test-python:
        runs-on: ubuntu-latest
        needs: lint-python
        defaults:
            run:
                working-directory: artemis-scraper
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: artemis
                    POSTGRES_PASSWORD: artemis
                    POSTGRES_DB: artemis
                ports: [ "5432:5432" ]
                options: >-
                    --health-cmd "pg_isready -U artemis" --health-interval 5s
                    --health-timeout 3s --health-retries 5
            redis:
                image: redis:7-alpine
                ports: [ "6379:6379" ]
                options: >-
                    --health-cmd "redis-cli ping" --health-interval 5s
                    --health-timeout 3s --health-retries 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: pip install -e ".[dev]"
            - name: Unit tests
              run: pytest tests/test_registry.py -v
            - name: E2E tests
              run: pytest tests/test_scrapers.py -v
              continue-on-error: true # E2E tests depend on live APIs

    build-python:
        runs-on: ubuntu-latest
        needs: test-python
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/build-push-action@v6
              with:
                  context: artemis-scraper
                  push: false
                  tags: artemis-scraper:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    lint-go:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: artemis-api
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.23"
            - run: go vet ./...
            - run: go build ./...

    build-go:
        runs-on: ubuntu-latest
        needs: lint-go
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/build-push-action@v6
              with:
                  context: artemis-api
                  push: false
                  tags: artemis-api:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
