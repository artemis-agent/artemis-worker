[project]
name = "artemis-scraper"
version = "0.1.0"
description = "AI-powered job scraping engine supporting 2000+ companies via ATS-platform scrapers"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "arq>=0.26",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "click>=8.1",
    "openai>=1.60",
    "pygithub>=2.5",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "aioboto3>=13.0",
    "pdfplumber>=0.11",
    "ddgs>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
artemis = "artemis.cli:cli"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["artemis*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests that hit live APIs",
]
